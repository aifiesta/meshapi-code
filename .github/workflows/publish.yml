name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      # Actions are pinned to commit SHAs, not tags (MESH-349). A tag is mutable —
      # whoever controls the upstream repo can repoint it at a different commit, and
      # this job holds an OIDC token that can publish to PyPI as us. Dependabot
      # (.github/dependabot.yml) bumps these SHAs and rewrites the trailing comment,
      # so pinning does not mean going stale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
