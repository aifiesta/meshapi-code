name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      # Actions are pinned to commit SHAs, not tags (MESH-349). A tag is mutable —
      # whoever controls the upstream repo can repoint it at a different commit, and
      # this job holds an OIDC token that can publish to PyPI as us. Dependabot
      # (.github/dependabot.yml) bumps these SHAs and rewrites the trailing comment,
      # so pinning does not mean going stale.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
